# ASX large-cap "quality" universe, v1.
#
# Hand-curated and deliberately spread across GICS sectors — this is a direct reaction to the
# earlier prototype's live basket, which ended up as 4 NZ-electricity-gentailer dual-listings
# picked purely by backtest P&L with zero diversification constraint (see the repo findings in
# the delivery plan). A CI test (tests/unit/data/test_universe.py) enforces a max-per-sector cap
# so that guardrail is structural, not just this comment.
#
# Symbols are IBKR-native tickers (exchange=ASX, currency=AUD) — no Yahoo/stooq ".AX"-style
# suffix needed, since backtesting sources historical bars from IBKR (see plan §2.10).
#
# Known, disclosed v1 limitations (not solved here): survivorship bias (today's large caps only,
# no later-delisted names) and manual/quarterly review cadence (a process, not automation).

