[project]
name = "ibkr-trading-bot"
version = "0.1.0"
description = "Modular, deterministic ASX trading bot: backtest / paper / live via a common strategy engine, IBKR broker adapter, and a local live dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "PyYAML==6.0.2",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
broker = [
    "ib_async==2.1.0",
]
dashboard = [
    "fastapi==0.115.5",
    "uvicorn==0.32.1",
]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "ruff==0.7.4",
    "httpx==0.27.2",  # required by fastapi.testclient.TestClient
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
