name: CI

on:
  pull_request:
  # Pushes to main run this via pages.yml, which deploys only once it passes.
  workflow_call:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (dev + dashboard extras)
        run: pip install -e ".[dev,dashboard]"
      - name: Ruff lint
        run: ruff check .
      - name: Pytest
        run: pytest -q
